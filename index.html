<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Calendar</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="mainWindowContainer">

   <div id="monthContainer">

      <div id="monthHeaderContainer">

         <button id="previousMonthBtn">&lt;</button>

            <div id="mmYyContainer">
               <span id="monthName"></span>
               <span id="yearNumHeader"></span>
            </div>

         <button id="nextMonthBtn">&gt;</button>

      </div>

      <div id="monthWrapper">
         <div id="daysNameContainer">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
         </div>

         <div id="datesContainer">
            
         </div>

      </div>

      <div id="dateDetailsPopover">
         <h1 id="detailsPanelDate"></h1>
         <button id="addEventBtn">+ Add event</button>
         <div class="eventInputContainer"></div>
      </div>

   </div>



</div>



<script src="main.js"></script>   
</body>
</html>
